<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"><style>html,body,#terminal{height:100%;margin:0;background:#101114}body{overflow:hidden}</style></head><body><div id="terminal"></div><script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script><script>const t=new Terminal({cursorBlink:true,fontSize:14,theme:{background:'#101114'}});t.open(document.getElementById('terminal'));t.focus();t.onData(d=>Vertex.input(d));window.vertexOutput=d=>t.write(d);window.vertexStatus=s=>t.writeln('\r\n\x1b[33m'+s+'\x1b[0m\r\n');</script></body></html>
